<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player VSL - Estilo VTurb</title>
    <style>
        /* RESET E ESTRUTURA BÁSICA */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* 1. CONTAINER DO VÍDEO */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px; /* Largura do player */
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 2. O OVERLAY (BOX VERMELHO CENTRAL) */
        .overlay-mask {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0); /* Fundo transparente */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        /* A Caixa Vermelha Estilo VTurb */
        .play-box {
            background: rgba(240, 60, 60, 0.85); /* Vermelho translúcido */
            backdrop-filter: blur(4px); /* Efeito de vidro */
            padding: 20px 40px;
            border-radius: 12px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: pulse-box 2s infinite;
            min-width: 280px;
        }

        .play-box h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .play-box strong {
            display: block;
            font-size: 18px;
            font-weight: 800;
            margin-top: 15px;
        }

        /* Ícone de Mute (SVG Puro) */
        .mute-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        @keyframes pulse-box {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* 3. BARRA DE PROGRESSO TURBO */
        .progress-container {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #ff0033; /* Vermelho VSL */
            box-shadow: 0 0 10px rgba(255, 0, 51, 0.7);
            transition: width 0.2s linear; /* Movimento suave */
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        /* 4. BADGE DE VELOCIDADE (CANTO SUPERIOR) */
        .speed-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            z-index: 15;
            backdrop-filter: blur(2px);
        }

        /* Esconder controles nativos */
        video::-webkit-media-controls { display: none !important; }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <div class="speed-badge">1.0x</div>

        <video id="vslVideo" playsinline loop muted poster="https://via.placeholder.com/800x450/cccccc/999999?text=Capa+do+Vídeo">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>

        <div class="overlay-mask" id="overlayBtn">
            <div class="play-box">
                <h3>Seu vídeo já começou</h3>
                
                <div class="mute-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-8-7.27-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                    </svg>
                </div>

                <strong>Clique para ouvir</strong>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('vslVideo');
        const overlay = document.getElementById('overlayBtn');
        const progressBar = document.getElementById('progressBar');
        
        let fakeProgress = 0;
        let isVideoActive = false;

        // 1. INÍCIO AUTOMÁTICO (MUDO)
        window.addEventListener('load', () => {
            video.play().catch(() => console.log('Autoplay bloqueado'));
            // Inicia a animação falsa da barra assim que a página carrega
            requestAnimationFrame(updateTurboBar);
        });

        // 2. LÓGICA DO CLIQUE (LIBERAR SOM)
        overlay.addEventListener('click', () => {
            video.muted = false;
            video.currentTime = 0; // Reinicia para o começo da copy
            video.loop = false; // Para de repetir o loop inicial
            video.play();
            
            isVideoActive = true; // Agora o vídeo é "real"
            
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        });

        // 3. A BARRA "TURBO" (O Segredo)
        function updateTurboBar() {
            let percentage;

            if (!isVideoActive) {
                // MODO TURBO (Antes do clique):
                // A barra enche sozinha até uns 15% para dar ansiedade
                if (fakeProgress < 15) {
                    fakeProgress += 0.05; // Velocidade do enchimento falso
                }
                percentage = fakeProgress;
            } else {
                // MODO REAL (Depois do clique):
                // Calcula o tempo real
                const realPercentage = (video.currentTime / video.duration) * 100;
                
                // Truque visual: A barra nunca volta para trás visualmente se o fake estava maior
                // Ela espera o vídeo real alcançar a barra falsa
                percentage = Math.max(realPercentage, fakeProgress);
            }

            progressBar.style.width = percentage + '%';
            requestAnimationFrame(updateTurboBar);
        }
    </script>

</body>
</html>
