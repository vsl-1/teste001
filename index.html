<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Estilo VSL</title>
    <style>
        /* 1. O Container do Vídeo */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px; /* Tamanho máximo */
            margin: 0 auto;
            background: #000;
            border-radius: 8px; /* Bordas arredondadas estilo Vturb */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* O vídeo em si */
        video {
            width: 100%;
            display: block;
            cursor: pointer;
        }

        /* 2. A Camada de "Smart Autoplay" (A Máscara) */
        .smart-autoplay-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Fundo meio escuro */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            backdrop-filter: blur(2px); /* Aquele desfoque chique */
        }

        /* O Botão/Mensagem Pulsante */
        .unmute-button {
            background: #ff0000; /* Cor da sua marca (ex: vermelho YouTube) */
            color: white;
            padding: 15px 30px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 18px;
            border-radius: 50px;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        /* Animação de Pulsar */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 0, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        /* 3. A Barra de Progresso Minimalista */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px; /* Altura fina estilo Vturb */
            background: rgba(255,255,255,0.2);
            z-index: 5;
            pointer-events: none; /* O usuário não pode clicar para pular */
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #ff0000; /* Mesma cor da marca */
            transition: width 0.1s linear;
        }

        /* Esconder controles nativos do navegador */
        video::-webkit-media-controls { display: none !important; }
    </style>
</head>
<body>

    <div class="video-wrapper" id="videoWrapper">
        <video id="myVideo" playsinline loop muted poster="https://via.placeholder.com/800x450">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>

        <div class="smart-autoplay-overlay" id="overlay">
            <div class="unmute-button">
                🔊 SEU VÍDEO JÁ COMEÇOU
            </div>
            <p style="color: white; font-family: sans-serif; margin-top: 10px; font-size: 14px;">Clique para ouvir</p>
        </div>

        <div class="custom-controls">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const overlay = document.getElementById('overlay');
        const progressBar = document.getElementById('progressBar');

        // 1. Tentar Autoplay Mudo assim que carregar (Padrão VSL)
        window.addEventListener('load', () => {
            video.play().catch(error => {
                console.log("Autoplay bloqueado pelo navegador, aguardando clique.");
            });
        });

        // 2. Ação ao Clicar na Máscara (O "Pulo do Gato")
        overlay.addEventListener('click', () => {
            video.muted = false; // Ativa o som
            video.currentTime = 0; // Opcional: Reinicia o vídeo para o começo da copy
            video.loop = false; // Para de repetir se estava em loop esperando
            video.play();
            
            // Some com a máscara
            overlay.style.opacity = '0'; 
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300); // Aguarda a transição
        });

        // 3. Atualizar a Barra de Progresso
        video.addEventListener('timeupdate', () => {
            const percentage = (video.currentTime / video.duration) * 100;
            progressBar.style.width = percentage + '%';
        });
    </script>

</body>
</html>
