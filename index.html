<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player VSL - Resume Feature</title>
    <style>
        /* RESET */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* CONTAINER GERAL */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        video { width: 100%; height: 100%; display: block; object-fit: cover; }

        /* --- 1. OVERLAY INICIAL (Caixa Vermelha) --- */
        .initial-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.1);
            display: none; /* Agora começa oculto, o JS decide se mostra */
            align-items: center; justify-content: center;
            z-index: 30;
        }

        .play-box {
            background: rgba(220, 50, 50, 0.9);
            backdrop-filter: blur(4px);
            padding: 20px 40px;
            border-radius: 12px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            animation: pulse 2s infinite;
        }
        .play-box h3 { font-size: 16px; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; }
        .play-box strong { display: block; font-size: 18px; font-weight: 800; margin-top: 10px; }
        .mute-icon svg { width: 45px; height: 45px; fill: white; }

        /* --- 2. OVERLAY "RESUME" (Tela Azul - Continuar Assistindo) --- */
        .resume-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(43, 85, 108, 0.85); /* Azul turquesa escuro estilo VTurb */
            backdrop-filter: blur(8px);
            display: none; /* JS decide se mostra */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            color: white;
            text-align: center;
        }

        .resume-overlay h2 {
            font-size: 22px; margin-bottom: 25px; font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .resume-actions { display: flex; gap: 20px; }

        .btn-resume {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.6);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-resume:hover { background: white; color: #2b556c; border-color: white; }
        .btn-resume svg { width: 18px; height: 18px; fill: currentColor; }

        /* --- 3. CAMADA DE PAUSA (Triângulo Branco) --- */
        .pause-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; display: none;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 30%);
        }
        .small-play-btn {
            position: absolute; bottom: 25px; left: 25px;
            width: 0; height: 0;
            border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 18px solid white;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* --- 4. BARRA DE PROGRESSO --- */
        .progress-container {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 6px;
            background: rgba(255,255,255,0.2); z-index: 25;
        }
        .progress-bar {
            height: 100%; width: 0%; background: #e04f35;
            transition: width 0.1s linear;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        video::-webkit-media-controls { display: none !important; }
    </style>
</head>
<body>

    <div class="video-wrapper" id="videoWrapper">
        
        <video id="myVideo" playsinline loop muted poster="https://via.placeholder.com/800x450/333333/999999?text=Cargando...">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>

        <div class="initial-overlay" id="initialOverlay">
            <div class="play-box">
                <h3>Tu video ya comenzó</h3>
                <div class="mute-icon">
                    <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-8-7.27-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                </div>
                <strong>Haz clic para escuchar</strong>
            </div>
        </div>

        <div class="resume-overlay" id="resumeOverlay">
            <h2>Ya empezaste a ver este video</h2>
            <div class="resume-actions">
                <button class="btn-resume" id="btnContinue">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    ¿Continuar viendo?
                </button>
                <button class="btn-resume" id="btnRestart">
                    <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    ¿Ver desde el inicio?
                </button>
            </div>
        </div>

        <div class="pause-overlay" id="pauseOverlay"><div class="small-play-btn"></div></div>

        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const wrapper = document.getElementById('videoWrapper');
        const initialOverlay = document.getElementById('initialOverlay'); // Vermelho
        const resumeOverlay = document.getElementById('resumeOverlay');   // Azul
        const pauseOverlay = document.getElementById('pauseOverlay');
        const progressBar = document.getElementById('progressBar');
        
        const btnContinue = document.getElementById('btnContinue');
        const btnRestart = document.getElementById('btnRestart');

        let hasStarted = false; 
        const STORAGE_KEY = 'vsl_video_progress'; // Chave para salvar no navegador

        // --- 1. VERIFICAÇÃO AO CARREGAR A PÁGINA ---
        window.addEventListener('load', () => {
            const savedTime = localStorage.getItem(STORAGE_KEY);
            const savedFloat = parseFloat(savedTime);

            // Tenta dar play mudo no fundo sempre
            video.play().catch(() => {});

            // LÓGICA DE DECISÃO:
            // Se tem tempo salvo E é maior que 5 segundos -> Mostra tela Azul (Resume)
            if (savedFloat && savedFloat > 5) {
                resumeOverlay.style.display = 'flex'; // Mostra Azul
                initialOverlay.style.display = 'none'; // Esconde Vermelho
            } else {
                resumeOverlay.style.display = 'none'; // Esconde Azul
                initialOverlay.style.display = 'flex'; // Mostra Vermelho
            }
        });

        // --- 2. SALVAR PROGRESSO A CADA 3 SEGUNDOS ---
        setInterval(() => {
            if (hasStarted && !video.paused) {
                localStorage.setItem(STORAGE_KEY, video.currentTime);
            }
        }, 3000);

        // --- 3. AÇÕES DA TELA AZUL (RESUME) ---
        
        // Botão Continuar
        btnContinue.addEventListener('click', (e) => {
            e.stopPropagation(); // Evita ativar o click do wrapper
            
            const savedTime = localStorage.getItem(STORAGE_KEY);
            video.currentTime = parseFloat(savedTime) || 0; // Pula para o tempo salvo
            
            startVideoReal();
            hideOverlays();
        });

        // Botão Reiniciar
        btnRestart.addEventListener('click', (e) => {
            e.stopPropagation(); // Evita ativar o click do wrapper
            
            video.currentTime = 0; // Volta para o zero
            localStorage.setItem(STORAGE_KEY, 0); // Reseta o salvo
            
            startVideoReal();
            hideOverlays();
        });


        // --- 4. AÇÃO DA TELA VERMELHA (PRIMEIRA VEZ) ---
        initialOverlay.addEventListener('click', () => {
            video.currentTime = 0; // Garante que comece do inicio da copy
            startVideoReal();
            hideOverlays();
        });

        // --- 5. CONTROLES GERAIS (PAUSA/PLAY) ---
        wrapper.addEventListener('click', (e) => {
            // Se clicou nos botões da tela azul, ignora essa função
            if(e.target.closest('.btn-resume')) return;

            if (hasStarted) {
                if (video.paused) {
                    video.play();
                    pauseOverlay.style.display = 'none';
                } else {
                    video.pause();
                    pauseOverlay.style.display = 'block';
                }
            }
        });

        // Funções Auxiliares
        function startVideoReal() {
            hasStarted = true;
            video.muted = false;
            video.loop = false;
            video.play();
        }

        function hideOverlays() {
            initialOverlay.style.display = 'none';
            resumeOverlay.style.display = 'none';
        }

        // Atualiza Barra
        video.addEventListener('timeupdate', () => {
            if (hasStarted) {
                const percentage = (video.currentTime / video.duration) * 100;
                progressBar.style.width = percentage + '%';
            }
        });
        
        video.addEventListener('ended', () => {
            pauseOverlay.style.display = 'block';
            localStorage.setItem(STORAGE_KEY, 0); // Reseta se terminar
        });

    </script>
</body>
</html>
