<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player VSL - Estilo Final</title>
    <style>
        /* RESET */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* 1. CONTAINER GERAL */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px; /* Borda levemente arredondada */
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* 2. OVERLAY INICIAL (A CAIXA VERMELHA) - Igual Imagem 1 */
        .initial-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.1); /* Fundo quase transparente */
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            transition: opacity 0.3s ease;
        }

        .play-box {
            background: rgba(220, 50, 50, 0.9); /* Vermelho Vturb */
            backdrop-filter: blur(4px);
            padding: 20px 40px;
            border-radius: 12px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            animation: pulse 2s infinite;
        }

        .play-box h3 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
        .play-box strong { display: block; font-size: 18px; font-weight: 800; margin-top: 10px; }
        
        /* Ícone de Mute cortado */
        .mute-icon svg { width: 45px; height: 45px; fill: white; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* 3. BOTÃO DE PAUSE (O TRIÂNGULO BRANCO) - Igual Imagem 2 */
        .pause-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            display: none; /* Escondido por padrão */
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 30%); /* Sombra suave embaixo */
        }

        /* O Triângulo Branco no Canto Inferior Esquerdo */
        .small-play-btn {
            position: absolute;
            bottom: 25px; /* Altura em relação à barra */
            left: 25px;
            width: 0; 
            height: 0; 
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 18px solid white; /* Triângulo puro CSS */
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* 4. BARRA DE PROGRESSO */
        .progress-container {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            height: 6px; /* Altura da barra */
            background: rgba(255,255,255,0.2);
            z-index: 25;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #e04f35; /* Laranja/Vermelho igual da imagem 2 */
            transition: width 0.1s linear;
        }

        /* Esconder controles nativos */
        video::-webkit-media-controls { display: none !important; }
    </style>
</head>
